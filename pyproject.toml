# ============================================================
# 墨匠 InkSmith —— Python 侧静态检查 / 构建配置
# ============================================================
# 定位说明（与 CI 的关系，务必先读）：
#   CI（.github/workflows/ci.yml）目前用「命令行 --select=F」覆盖本文件，
#   即线上门禁仍是 F 类（未定义名/未使用导入等**运行时级 bug**）。本文件
#   的存在**不改变 CI 当前行为**（命令行 --select 优先级高于 pyproject），
#   它的价值在于：
#     1) 把 line-length / target-version 等约定**钉死为单一数据源**，
#        避免每个人本地 ruff 用不同行长判定同一份代码；
#     2) 为**未来增量扩展**门禁预留配置（导入排序 I、末尾换行 W292 等
#        零风险可自动修复类），逐类开启、逐类修债，而非一次性全开爆红；
#     3) 统一本地 `ruff check` / `ruff format` 行为。
#
# 历史债务现状（2026-10-11 实测，77 文件 / 19727 行）：
#   F   : 0     （已入库代码干净，CI 红线）
#   I   : 29    （导入排序，全部可 --fix 安全自动修复）
#   W   : 22    （全部为 W292 文件末尾缺换行，可 --fix 修复）
#   E501: 676   （超 120 列的行，历史长注释/长 f-string，**长期债**）
#   E701/E702/E741: 97 （多语句同行/歧义变量名 l，集中在 _engine.py）
#   C90 : 33    （函数圈复杂度超标，main() 高达 138——属**诊断信息**，
#                 不作为 CI 失败项，否则天天红；见下方注释）
#
# 因此本文件**默认只启用 F + I + W**：F 保底（等价现有 CI），I/W 是零风险
# 可自动修复类。E501 / E701 / E702 / C90 均**不纳入 select**——它们是历史
# 风格债与诊断信息，纳入会立刻让门禁变红、阻塞所有 PR，违背「增量改进」
# 原则。待相关债务清理到零，再逐类加入 select。
# ============================================================

[tool.ruff]
# 行宽约定：统一钉在 120。>120 的行仅 42 条，设 120 既不逼历史代码返工，
# 也给出明确上限。注意：line-length 仅影响 E501 与 formatter 折行宽度，
# 因 E501 未纳入 select，当前**不会**有行因超宽而报错。
line-length = 120

# 目标解释器：与开发环境/本机一致（3.10.11）。影响 UP（pyupgrade）等规则
# 的判定，避免误报 3.11+ 专属语法。
target-version = "py310"

# 让 ruff 的 formatter 也遵循同一行宽，保证 check 与 format 口径一致。
[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# 默认启用集：F（运行时 bug，CI 红线）+ I（导入排序，零风险）+ W（多数为
# W292 末尾换行，零风险）。这是「保底 + 可安全自动修复」的最小集。
select = ["F", "I", "W"]

# 全局忽略：
#   E501 行宽：作为**诊断信息**保留（可 `ruff check --select=E501` 单独看），
#               但不作为失败项，理由见文件头。此处显式 ignore 以防未来有人
#               把 E 类整体加入 select 时意外爆红。
ignore = [
    "E501",  # 行宽超限：长期债，诊断用，不作为门禁失败项
]

# 每个文件的豁免：_engine.py 是**刻意保留的历史孤儿代码**（文件头注释说明：
# 引用的词表/工具函数在 demo_novel_gen.py，未 import/exec，是留档对照片段）。
# 它自带 `# ruff: noqa: F821`，且集中了绝大多数 E701/E702 违规。因当前 select
# 不含 E 类，本不会报；此处预先豁免 I/W，避免未来扩展 select 时误伤这段对照
# 代码。test_* 与 tool/probe_* 属一次性脚本/探针，放宽导入排序与末尾换行。
[tool.ruff.lint.per-file-ignores]
"scripts/_engine.py" = ["I", "W"]
"scripts/test_*.py" = ["I", "W292"]
"tool/probe_*.py" = ["I", "W292"]
