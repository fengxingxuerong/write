name: novel_writer
description: 墨匠 InkSmith —— 本地优先的一键小说写作工具（默认离线，可选 AI）。
publish_to: 'none'
# 语义化版本 MAJOR.MINOR.PATCH+BUILD：首个提交即自称「1.0 全功能版」（2026-08-05），
# 功能持续演进至今（12 角色多模型协作流水线 / 五大导出格式 / 本地规则质检门禁），
# 故版本号与项目自我认知对齐至 1.0.0；build 号随每次发版递增。变更见 CHANGELOG.md。
version: 1.0.0+2

environment:
  # 代码使用 onReorderItem（Flutter 3.41+）/ Color.withValues（3.27+）等新 API，
  # 与 CI 钉住的 3.44.9 对齐；Dart 对应 3.12.x。
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # 状态管理：Provider / StateNotifier 即 ViewModel，轻量可测
  flutter_riverpod: ^2.5.1
  # 声明式路由，原生支持多端深链
  go_router: ^14.2.7
  # 获取各平台 App 文档/支持目录（存储项目数据）
  path_provider: ^2.1.3
  # 导出时让用户自选保存路径
  file_picker: ^8.0.0
  # 实体主键（uuid v4）
  uuid: ^4.4.0
  # 模型值相等简化（轻量，无网络依赖）
  equatable: ^2.0.5
  # UTF-16 安全的字符簇遍历（grapheme），用于正文截断与字数统计
  characters: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 注：不引入 package:test —— flutter_test 已内建等价 API，
  # 避免与 flutter_test 的 test_api 版本约束产生解析冲突。

# 网络能力说明（2026-10-03 更正措辞）：
# 本工程**不引入 pub 网络库**（http / dio 等）——LLM 调用一律用 SDK 自带的
# `dart:io` HttpClient，避免为「发几个请求」引入一整套依赖与传递依赖。
#
# ⚠️ 但这**不等于「完全离线、零网络请求」**，旧注释的表述具有误导性。
# 实测 lib/ 下 7 个文件含真实 HttpClient 调用：
#   lib/engine/llm_engine.dart              流式生成
#   lib/engine/llm_chat_client.dart         标题/记忆/校对等非流式对话
#   lib/ai_pipeline/services/llm_router.dart 多角色流水线路由
#   lib/features/editor/continue_write_dialog.dart  编辑器「续写」
#   lib/features/editor/rewrite_dialog.dart        编辑器「修改」
#   lib/features/workspace/llm_settings_dialog.dart 本地模型探测
#   lib/core/crash_reporter.dart                   崩溃日志上报
# 它们均对应**用户主动开启**的能力（云端/本地 LLM、崩溃上报），默认不发请求。
# 准确的说法是「默认离线、联网须用户主动启用」，详见 README 首段与
# lib/features/workspace/privacy_page.dart。
flutter:
  uses-material-design: true
  assets:
    - assets/
