# 墨匠 InkSmith — CI 流水线
# 触发: push / PR 到 main、master；也可手动 workflow_dispatch
# 步骤: flutter analyze → flutter test → web 工作台浏览器回归 → (Windows) Release 构建

name: CI

# 同一分支有新推送时，取消仍在跑的旧 CI（省额度、更快反馈）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  analyze-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Python scripts quality check
        # scripts/ Python 流水线必须通过：语法编译 + ruff F 类静态检查
        # （F 类含未定义名/未使用导入等运行时级 bug，compileall 抓不到；
        # 历史教训：StateError 错用就是纯语法检查漏掉的 NameError）。
        run: |
          python3 -m compileall -q scripts
          python3 -m pip install --quiet 'ruff==0.16.2'
          # 只对「已入库的脚本」做 F 类检查：临时探针/诊断脚本不入库也不设防
          git ls-files 'scripts/*.py' | xargs -r python3 -m ruff check --select=F --output-format=concise
          # 规则单一数据源：生成物必须与 rules/quality_rules.json 完全一致
          # （词表/阈值改了 JSON 却忘了跑 rules_codegen 就在此失败）
          python3 scripts/rules_codegen.py --check
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          # compileall 不会发现同目录导入/模块入口错误，补运行时导入回归。
          python3 -m scripts.generate_novel --help >/dev/null
          python3 -m scripts.novel_pipeline --help >/dev/null
          python3 -m scripts.fanqie_review --help >/dev/null
          python3 -m scripts.qa_semantic_check --help >/dev/null
          python3 -m scripts.md_projection --help >/dev/null

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与开发环境/CI 双端一致：代码使用 onReorderItem（3.41+）、
          # Color.withValues（3.27+）等新 API，3.24 无法编译。
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Enable Flutter web (analyze 需要)
        run: flutter config --enable-web

      - name: Pub get
        # pubspec.lock 统一指向 pub.dev（2026-10-01 起不再写镜像源）：本地要用国内
        # 镜像时设置 PUB_HOSTED_URL 即可，不必让 lockfile 携带镜像 URL。
        # 钉死 lockfile 保证 CI/团队可复现。
        run: |
          for i in 1 2 3; do
            if flutter pub get --enforce-lockfile; then exit 0; fi
            echo "::notice::flutter pub get attempt ${i} failed (network or resolution), retrying in 20s"
            sleep 20
          done
          echo "::error::flutter pub get failed after 3 attempts"
          exit 1

      - name: Offline demo write smoke
        # 零 API 费端到端回归：模板引擎连写三章 + 番茄双质检（NovelQualityChecker
        # + FanqieGateChecker）必须产出非空正文并返回成功。结果会写入
        # verify-logs/（gitignore），不污染工作区。
        #
        # ⚠️ 必须用 `flutter test`，不能写成 `dart run tool/write_demo_novel.dart`
        # （2026-10-01 修正）：生成链路传递依赖到 package:flutter，而 `dart run`
        # 用的是不带 dart:ui 的纯 Dart VM，必然报 "Dart library 'dart:ui' is not
        # available on this platform"。旧写法从加入那天起就没绿过（该提交长期
        # 未推送，所以没人发现）。详见 tool/write_demo_novel.dart 文件头。
        run: flutter test test/smoke/write_demo_novel_test.dart

      - name: Dart analyze
        # --fatal-infos：任何 info（含 deprecation）都算失败，兑现 README「零告警」承诺
        run: dart analyze --fatal-infos

      - name: Flutter test
        run: flutter test --coverage

      - name: Enforce coverage threshold
        # 覆盖率低于阈值时失败，防止测试退化
        run: |
          test -s coverage/lcov.info || { echo "::error::coverage/lcov.info missing or empty"; exit 1; }
          COV=$(grep -oP 'LF:\d+' coverage/lcov.info | awk -F: '{s+=$2} END {print s+0}')
          LH=$(grep -oP 'LH:\d+' coverage/lcov.info | awk -F: '{s+=$2} END {print s+0}')
          if [ "$COV" -le 0 ]; then
            echo "::error::Coverage denominator is zero"
            exit 1
          fi
          echo "Lines hit: $LH / $COV"
          PERCENT=$(python3 -c "print(round(100.0*$LH/$COV, 1))")
          echo "Coverage: $PERCENT%"
          python3 - "$LH" "$COV" <<'PY'
          import sys
          hit, total = map(int, sys.argv[1:])
          if total <= 0 or hit / total * 100 < 80:
              raise SystemExit(1)
          PY
          python3 - <<'PY'
          from pathlib import Path
          lcov = Path('coverage/lcov.info').read_text(encoding='utf-8')
          covered = {
              line[3:].replace(chr(92), '/')
              for line in lcov.splitlines()
              if line.startswith('SF:')
          }
          # 「关键安全/存储/质检文件必须进 LCOV」的**实际**清单
          # （README 承诺过这道闸门；清单依据 2026-09-28 本地 lcov 实测在册文件补全，
          #  2026-10-01 起从 3 个扩到 12 个，避免文案比实现严的口径漂移）。
          # 注意：不把纯常量生成物 quality_rules.g.dart 放进来——常量声明不产生可执行行。
          required = {
              'lib/core/security/secret_store.dart',
              'lib/models/llm_config.dart',
              'lib/models/novel.dart',
              'lib/ai_pipeline/services/pipeline_storage.dart',
              'lib/ai_pipeline/services/composite_quality_gate.dart',
              'lib/storage/app_database.dart',
              'lib/storage/chapter_repository.dart',
              'lib/storage/chapter_snapshot_service.dart',
              'lib/storage/novel_repository.dart',
              'lib/storage/setting_repository.dart',
              'lib/engine/quality/novel_quality_checker.dart',
              'lib/engine/quality/fanqie_gate_checker.dart',
          }
          missing = sorted(required - covered)
          source_count = len(list(Path('lib').rglob('*.dart')))
          print(f'LCOV source files: {len(covered)} / {source_count}')
          if missing:
              print('::error::Required production files missing from coverage:')
              print('::error::' + ', '.join(missing))
              raise SystemExit(1)
          PY

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  verify-web:
    name: Web workbench verify
    # 网页工作台（web/index.html + app.js + ai.js）的真实浏览器回归：
    # 书架 CRUD / 章节编辑 / AI 守卫 / 导入原子性 / 无运行时异常等。
    # 与 Flutter 任务无依赖，可并行；Chrome 由 ubuntu-latest 镜像预装。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Ensure Chrome available
        # ⚠️ 优先装「Chrome for Testing」，**不要**用 runner 镜像自带的 google-chrome
        # （2026-10-01 修正）。Ubuntu runner 上 /usr/bin/google-chrome 是 snap 包装器
        # （snap-bin/google-chrome），在容器里起不了 headless：症状是浏览器回归
        # **4 秒即挂**（不是等满 30s 冷启动超时），报错难懂。
        # 实测对照：run #19 走 puppeteer 安装分支（9s）→ 回归 34s 通过；
        #           run #20 走系统自带分支（1s）→ 回归 4s 失败。
        # 故：先装 Chrome for Testing，只有装不上才回退系统 chrome，
        # 并且无论哪条路都**当场验证能否真的 headless 起一次**，把故障留在本步骤。
        run: |
          BIN=""
          if npx -y @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome" >/dev/null 2>&1; then
            BIN=$(find "$RUNNER_TEMP/chrome" -type f -name chrome | head -n 1)
            echo "Installed Chrome for Testing: ${BIN:-<not found>}"
          fi
          if [ -z "$BIN" ] || [ ! -x "$BIN" ]; then
            echo "::notice::Chrome for Testing unavailable, falling back to system google-chrome"
            BIN=$(command -v google-chrome || true)
          fi
          if [ -z "$BIN" ]; then
            echo "::error::No usable Chrome binary found"
            exit 1
          fi
          # 当场验证：能不能真的 headless 起一次并吐 DOM。起不来就在这里失败，
          # 而不是留到回归步骤里报一句看不懂的错。
          if ! "$BIN" --headless --no-sandbox --disable-gpu --dump-dom about:blank >/dev/null 2>&1; then
            echo "::error::Chrome at $BIN cannot start headless (snap wrapper?); see comment above"
            exit 1
          fi
          echo "CHROME_PATH=$BIN" >> "$GITHUB_ENV"
          echo "Usable Chrome: $BIN"

      - name: Browser regression (3 suites)
        run: |
          node scripts/verify_web.cjs
          node scripts/verify_ai_failure.cjs
          node scripts/verify_web_ai.cjs

  build-windows:
    name: Build Windows Release
    needs: [analyze-test, verify-web]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Pub get
        # 与 analyze-test 同口径：lockfile 已统一指向 pub.dev，只保留重试以抗网络抖动。
        # 注意 windows-latest 默认 shell 是 PowerShell，此脚本为 bash 语法须显式指定。
        shell: bash
        run: |
          for i in 1 2 3; do
            if flutter pub get --enforce-lockfile; then exit 0; fi
            echo "::notice::flutter pub get attempt ${i} failed, retrying in 20s"
            sleep 20
          done
          echo "::error::flutter pub get failed after 3 attempts"
          exit 1

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package portable Windows build
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+]+)').Matches[0].Groups[1].Value
          $release = Join-Path $PWD 'build/windows/x64/runner/Release'
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $zip = Join-Path $dist "InkSmith-$version-windows-x64.zip"
          Compress-Archive -Path (Join-Path $release '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "Portable artifact: $zip"
          Write-Host "SHA256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-writer-windows-portable
          path: dist/
          retention-days: 14
