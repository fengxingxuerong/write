# 墨匠 InkSmith — CI 流水线
# 触发: push / PR 到 main、master；也可手动 workflow_dispatch
# 步骤: flutter analyze → flutter test → (Windows) Release 构建

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  analyze-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Python scripts quality check
        # scripts/ Python 流水线必须通过：语法编译 + ruff F 类静态检查
        # （F 类含未定义名/未使用导入等运行时级 bug，compileall 抓不到；
        # 历史教训：StateError 错用就是纯语法检查漏掉的 NameError）。
        run: |
          python3 -m compileall -q scripts
          python3 -m pip install --quiet ruff
          # 只对「已入库的脚本」做 F 类检查：临时探针/诊断脚本不入库也不设防
          git ls-files 'scripts/*.py' | xargs -r python3 -m ruff check --select=F --output-format=concise

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Enable Flutter web (analyze 需要)
        run: flutter config --enable-web

      - name: Pub get
        run: flutter pub get

      - name: Offline demo write smoke
        # 零 API 费端到端回归：模板引擎连写三章 + 番茄双质检（NovelQualityChecker
        # + FanqieGateChecker）必须产出非空正文并返回成功。结果会写入
        # verify-logs/（gitignore），不污染工作区。
        run: dart run tool/write_demo_novel.dart

      - name: Dart analyze
        run: dart analyze

      - name: Flutter test
        run: flutter test --coverage

      - name: Enforce coverage threshold
        # 覆盖率低于阈值时失败，防止测试退化
        run: |
          COV=$(grep -oP 'LF:\d+' coverage/lcov.info | awk -F: '{s+=$2} END {print s}')
          LH=$(grep -oP 'LH:\d+' coverage/lcov.info | awk -F: '{s+=$2} END {print s}')
          echo "Lines hit: $LH / $COV"
          PERCENT=$(python3 -c "print(round(100.0*$LH/$COV, 1))" 2>/dev/null || echo "unknown")
          echo "Coverage: $PERCENT%"
          if [ "$PERCENT" != "unknown" ] && [ "$(python3 -c "print(1 if $PERCENT >= 50 else 0)")" = "0" ]; then
            echo "::error::Coverage $PERCENT% below threshold 50%"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  build-windows:
    name: Build Windows Release
    needs: analyze-test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-writer-windows
          path: build/windows/x64/runner/Release/
          retention-days: 14
